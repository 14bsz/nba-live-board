<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>NBA 看台 · 关注球员实时数据</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14.5' fill='%23ff7a1a'/%3E%3Cg fill='none' stroke='%231c0d02' stroke-width='1.5'%3E%3Cpath d='M1.5 16h29'/%3E%3Cpath d='M16 1.5c4.2 4.2 4.2 24.8 0 29'/%3E%3Cpath d='M16 1.5c-4.2 4.2-4.2 24.8 0 29'/%3E%3Cpath d='M4 8.2c7.4 2.1 16.6 2.1 24 0'/%3E%3Cpath d='M4 23.8c7.4-2.1 16.6-2.1 24 0'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14.5" fill="#ff7a1a"/>
          <g fill="none" stroke="#1c0d02" stroke-width="1.5">
            <path d="M1.5 16h29"/>
            <path d="M16 1.5c4.2 4.2 4.2 24.8 0 29"/>
            <path d="M16 1.5c-4.2 4.2-4.2 24.8 0 29"/>
            <path d="M4 8.2c7.4 2.1 16.6 2.1 24 0"/>
            <path d="M4 23.8c7.4-2.1 16.6-2.1 24 0"/>
          </g>
        </svg>
        <div class="brand-text">
          <h1>NBA 看台</h1>
          <p>关注球员 · 实时数据</p>
        </div>
      </div>

      <div class="top-actions">
        <div class="date-nav" aria-label="比赛日期">
          <button id="prevDate" class="icon-btn" title="前一天" aria-label="前一天">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="date-box">
            <span id="dateLabel">加载中…</span>
            <small id="dateHint">美东赛程日</small>
          </div>
          <button id="nextDate" class="icon-btn" title="后一天" aria-label="后一天">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <button id="todayDate" class="text-btn" title="回到今天的赛程">今天</button>
        </div>
        <div class="action-buttons">
          <button id="authBtn" class="text-btn auth-btn" title="登录即注册，数据云同步">登录</button>
          <button id="refreshBtn" class="icon-btn" title="立即刷新" aria-label="立即刷新">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
          </button>
          <button id="exportBtn" class="text-btn" title="把关注名单等数据保存成备份文件">导出备份</button>
          <button id="importBtn" class="text-btn" title="从备份文件恢复关注名单等数据">导入备份</button>
          <button id="addPlayerBtn" class="primary-btn">+ 添加球员</button>
        </div>
      </div>
    </header>

    <nav class="view-tabs" id="viewTabs" aria-label="切换看台视图">
      <button type="button" class="view-tab" data-view="teams" aria-pressed="false">
        <span class="vt-title">球队</span>
        <small>比赛情况</small>
        <span class="vt-count" data-view-count="teams">—</span>
      </button>
      <button type="button" class="view-tab active" data-view="players" aria-pressed="true">
        <span class="vt-title">球员</span>
        <small>个人数据</small>
        <span class="vt-count" data-view-count="players">—</span>
      </button>
    </nav>

    <div id="errorBanner" class="error-banner" hidden>
      <span id="errorText">数据更新失败</span>
      <button id="retryBtn">重试</button>
    </div>

    <section id="teamsView" class="view-panel" hidden>
      <section id="teamSummary" class="team-summary" aria-live="polite"></section>
      <section class="team-toolbar">
        <div class="segmented" id="gameFilter" role="group" aria-label="筛选比赛">
          <button class="seg-btn active" data-game-filter="all">全部 <span class="count">0</span></button>
          <button class="seg-btn" data-game-filter="live">进行中 <span class="count">0</span></button>
          <button class="seg-btn" data-game-filter="pre">未开始 <span class="count">0</span></button>
          <button class="seg-btn" data-game-filter="final">已结束 <span class="count">0</span></button>
          <button class="seg-btn" data-game-filter="watch">关注球队 <span class="count">0</span></button>
        </div>
        <span class="updated" id="teamUpdatedAt">加载中…</span>
      </section>
      <div id="teamGrid" class="team-grid"></div>
      <div id="teamEmpty" class="empty" hidden></div>
    </section>

    <div id="playersView" class="view-panel">
      <section id="summaryBar" class="summary" aria-live="polite"></section>
      <section id="hotBar" class="hotbar" aria-label="打得好球员汇总" hidden></section>

      <section class="toolbar">
        <div class="segmented" id="statusFilter" role="group" aria-label="按状态筛选">
          <button class="seg-btn active" data-status="all">全部 <span class="count">0</span></button>
          <button class="seg-btn" data-status="played">已上场 <span class="count">0</span></button>
          <button class="seg-btn" data-status="onCourt">在场中 <span class="count">0</span></button>
          <button class="seg-btn" data-status="resting">休息中 <span class="count">0</span></button>
          <button class="seg-btn" data-status="hot">打得好 <span class="count">0</span></button>
          <button class="seg-btn" data-status="bag">我的背包 <span class="count">0</span></button>
          <button class="seg-btn" data-status="stable">稳定 <span class="count">0</span></button>
          <button class="seg-btn" data-status="flash">昙花一现 <span class="count">0</span></button>
          <button class="seg-btn" data-status="bench">未上场 <span class="count">0</span></button>
          <button class="seg-btn" data-status="idle">无比赛 <span class="count">0</span></button>
        </div>
        <div class="toolbar-right">
          <label class="field">
            <span>球队</span>
            <select id="teamFilter"><option value="all">全部</option></select>
          </label>
          <label class="field">
            <span>排序</span>
            <select id="sortSelect"></select>
          </label>
          <label class="field threshold-field" title="赛季火热场次达到该值算「稳定」，否则算「昙花一现」">
            <span>火热阈值</span>
            <input id="hotThreshold" type="number" min="1" max="30" step="1" value="5">
          </label>
          <button id="sortDirBtn" class="icon-btn small" title="切换升降序" aria-label="切换升降序">↓</button>
          <span class="updated" id="updatedAt">加载中…</span>
        </div>
      </section>

      <main>
        <div id="grid" class="grid"></div>
        <div id="emptyState" class="empty" hidden></div>
      </main>
    </div>

    <footer class="foot">
      <span>数据来源：ESPN 公开接口 · 球队技术统计来自现场 box score</span>
      <span id="refreshHint">每 10 秒自动刷新</span>
    </footer>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-head">
        <h2 id="modalTitle">添加关注球员</h2>
        <button id="modalClose" class="icon-btn" aria-label="关闭">×</button>
      </header>
      <input id="playerSearch" class="search-input" type="search" placeholder="输入中文名或英文名搜索，如 库里、Jaquez" autocomplete="off">
      <p class="search-hint">支持中文译名或英文姓 / 全名，添加后会自动显示中文译名。</p>
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <div id="authModal" class="modal" hidden>
    <div class="modal-card auth-card" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
      <header class="modal-head">
        <h2 id="authModalTitle">登录 / 注册</h2>
        <button id="authModalClose" class="icon-btn" aria-label="关闭">×</button>
      </header>
      <p class="search-hint">登录即注册：账号首次使用时自动创建，无需单独注册。登录后关注名单等数据保存在云端，换设备、刷新都不丢。</p>
      <input id="authUsername" class="search-input auth-field" type="text" placeholder="用户名（2-20 位中文 / 字母 / 数字）" autocomplete="username" maxlength="20">
      <input id="authPassword" class="search-input auth-field" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password" maxlength="64">
      <p id="authError" class="auth-error" hidden></p>
      <button id="authSubmit" class="primary-btn auth-submit">登录 / 自动注册</button>
    </div>
  </div>

  <div id="rosterModal" class="modal" hidden>
    <div class="modal-card roster-modal-card" role="dialog" aria-modal="true" aria-labelledby="rosterModalTitle">
      <header class="modal-head roster-modal-head">
        <div class="roster-modal-titles">
          <h2 id="rosterModalTitle">全部球员</h2>
          <p id="rosterModalMeta" class="roster-modal-meta"></p>
        </div>
        <button id="rosterModalClose" class="icon-btn" aria-label="关闭">×</button>
      </header>
      <div id="rosterModalBody" class="roster-modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <input id="importFile" type="file" accept=".json,application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
